<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Form</title>
    <link rel="stylesheet" href="Name.css">
</head>
<body>
    <form action="gender and state.html" class="name-form">
        <h1>Create Account</h1>

        <div class="field-group">
            <label for="Fullname" class="l1">First Name:</label>
            <input type="text" name="Fullname" id="Fullname" required placeholder="your name" class="i1">
        </div>

        <div class="field-group">
            <label for="Shortname" class="l2">Last Name:</label>
            <input type="text" name="Shortname" id="Shortname" required placeholder="last name" class="i2">
        </div>

        <div class="d2">
            <button type="submit">Next</button>
        </div>
    </form>
</body>
</html>
