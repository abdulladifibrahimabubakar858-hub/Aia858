<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="Login.css">
</head>
<body>
    <form action="Empty.html" class="f1">
        <h1 class="hhh">Welcome To Aia's Blog</h1>
        <p class="p1">Enter your details below</p>

        <div class="field-group">
            <label for="Email" class="l1">Email Address:</label>
            <input type="email" name="Email" id="Email" class="i1" required placeholder="you@gmail.com">
        </div>

        <div class="field-group">
            <label for="password" class="l2">Password:</label>
            <input type="password" name="password" id="password" class="i2" required placeholder="your password">
        </div>

        <label for="remember" class="l3">
            <input type="checkbox" id="remember" class="i3"> Remember Me
        </label>

        <button class="login-btn" type="submit">Sign In</button>

        <div class="p3">
            <a href="Forget.html">Forget password</a>
        </div>

        <p class="p2">Don't have an account?</p>
        <div class="p4">
            <a href="Create an account.html">Sign up instead</a>
        </div>
    </form>
</body>
</html>
