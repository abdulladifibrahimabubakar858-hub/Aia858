<!DOCTYPE html>
<html lang="en">
<head>

    <title>Contact Me</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <div class="contact-page">
        <form action="thank you.html" class="f1">
            <h1>Contact Me</h1>
            <p class="intro">Feel free to send your details and I will get back to you soon.</p>

            <div class="field-group">
                <label for="email" class="l1">Enter Your Email Address:</label>
                <input type="email" name="email" id="email" class="i1" required placeholder="you@gmail.com">
            </div>

            <div class="field-group">
                <label for="tel" class="l2">Enter Your Phone Number:</label>
                <input type="tel" name="number" id="tel" class="i2" required placeholder="+23400000000000">
            </div>

            <button class="send-message" type="submit">Send</button>

            <h2>Send Message via This Email:</h2>
            <div class="d1">
                <address>
                    <a href="mailto:Abdulladifibrahimabubakar858@gmail.com" class="a1">Abdulladifibrahimabubakar858@gmail.com</a>
                </address>
            </div>

            <h2>Call This Number For More Information</h2>
            <div class="d2">
                <address>
                    <a href="tel:08075052529" class="a2">+2348075052529</a>
                </address>
            </div>
        </form>
    </div>
</body>
</html>
